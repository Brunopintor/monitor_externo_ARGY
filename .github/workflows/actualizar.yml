# Actualización diaria del tablero.
# Corre de lunes a viernes a las 19:00 de Argentina (22:00 UTC), y también a mano desde
# la pestaña Actions (botón "Run workflow").
# 1) baja los datos y arma el tablero, 2) commitea data/ y docs/ si cambiaron,
# 3) publica docs/ en GitHub Pages.
name: Actualizar tablero

on:
  schedule:
    - cron: "17 22 * * 1-5"   # 19:17 ART; a la hora en punto GitHub suele atrasarse
  workflow_dispatch:

permissions:
  contents: write   # commitear data/ y docs/
  pages: write      # publicar en Pages
  id-token: write   # requerido por deploy-pages

concurrency:
  group: actualizar-tablero
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Actualizar base (BCRA, paralelos, DXY, reservas netas)
        run: python actualizar_base.py

      - name: Armar tablero
        run: python tablero.py

      - name: Commitear datos nuevos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "Datos al $(TZ=America/Argentina/Buenos_Aires date +%Y-%m-%d)"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
